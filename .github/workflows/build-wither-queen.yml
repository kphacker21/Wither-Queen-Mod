        run: |
          import base64, hashlib, io, os, pathlib, zipfile
          encoded = ''.join(os.environ['SOURCE_ARCHIVE_B64'].split())
          payload = base64.b64decode(encoded, validate=True)
          expected = '61efd7ee9abf2ec2a2244a0688906fb042199010f02ea023242e5067a7b7e67a'
          if hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit('Source data is incomplete. Upload the entire downloaded YAML file instead of copying its text.')
          target = pathlib.Path('project').resolve()
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for name in archive.namelist():
                  if not (target / name).resolve().is_relative_to(target):
                      raise SystemExit('Invalid source archive path')
              archive.extractall(target)
          print('Verified source checksum and extracted all project files.')
      - name: Generate original texture assets
        run: |
          python3 -m venv .assets
          .assets/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
          .assets/bin/python project/tools/generate_assets.py
      - name: Compile, test and reobfuscate mod
        working-directory: project
        run: gradle --no-daemon clean build
      - name: Save installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: WitherQueen-Forge-1.21.1-JAR
          path: project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
